<style>
body{margin:0}
.np{--bg:#0B0D10;--sf:#14181D;--hair:#262C34;--ink:#E8ECF1;--ink2:#B4BCC8;--ink3:#8D97A6;--calm:#6FD1A8;
 width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box}
.np *{box-sizing:border-box}
.np .mono{font-family:'Martian Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.np .bar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;height:64px}
.np .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500}
.np .cal{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #38404B;color:var(--ink)}
.np .body{flex:1;overflow:hidden;padding:8px 20px 0;display:flex;flex-direction:column;gap:26px}
.np h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em;line-height:1.3}
.np .meta{margin:6px 0 0;font-size:12px;color:var(--ink3)}
.np .num{margin:0;font-size:132px;line-height:0.9;color:var(--calm);letter-spacing:-0.06em;font-weight:500}
.np .lab{margin:14px 0 0;font-size:14px;color:var(--ink2);line-height:1.45}
.np .lab b{display:block;font-size:22px;color:var(--ink);letter-spacing:-0.02em;margin-top:4px;font-weight:600}
.np .ticks{display:flex;justify-content:space-between;align-items:flex-end;height:30px}
.np .ticks i{display:block;width:2px;height:12px;background:#3A424D;border-radius:1px}
.np .ticks i.now{height:30px;background:var(--ink)}
.np .ticks i.end{height:30px;background:var(--calm);width:3px}
.np .tl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:8px}
.np .tl span:last-child{color:var(--calm)}
.np .list{background:var(--sf);border-radius:18px;padding:4px 18px}
.np .p{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 0;border-top:1px solid var(--hair);font-size:14px}
.np .p:first-child{border-top:0}
.np .p b{font-weight:600}
.np .p span{font-size:11px;color:var(--ink3);white-space:nowrap}
.np .p span.open{color:var(--calm)}
.np .foot{padding:12px 20px 28px;border-top:1px solid var(--hair)}
.np .cta{display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;background:var(--calm);color:#06150E;font-weight:700;font-size:16px;text-decoration:none}
</style>
</helmet>

        <div class="tl mono"><span>20 Nov</span><span>19 Dec</span></div>
      </div>
    </section>
    <section class="list" aria-label="The four periods">
      <div class="p"><b>Cheque presented in time</b><span class="mono">Done</span></div>
